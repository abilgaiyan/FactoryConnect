name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: src/FactoryConnect.Dashboard/ClientApp/package-lock.json

      - name: Install dashboard contract toolchain
        working-directory: src/FactoryConnect.Dashboard/ClientApp
        run: npm ci

      - name: Build, typecheck and test dashboard client
        working-directory: src/FactoryConnect.Dashboard/ClientApp
        run: npm run build && npm run typecheck && npm test

      - name: Check dashboard reporting contract
        working-directory: src/FactoryConnect.Dashboard/ClientApp
        run: npm run contracts:check

      - name: Restore
        run: dotnet restore FactoryConnect.sln

      - name: Build
        run: dotnet build FactoryConnect.sln --configuration Release --no-restore

      - name: Test ordinary suite
        run: >-
          dotnet test FactoryConnect.sln
          --configuration Release
          --no-build
          --filter "Category!=SqlServerIntegration"

  sql-server-integration:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FactoryConnect_CI_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FactoryConnect_CI_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      FACTORYCONNECT_SQLSERVER_TEST_CONNECTION_STRING: >-
        Server=localhost,1433;Database=master;User Id=sa;Password=FactoryConnect_CI_2026!;Encrypt=True;TrustServerCertificate=True

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore FactoryConnect.sln

      - name: Build integration tests
        run: >-
          dotnet build tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-restore

      - name: Accept registered migration 021 schema and transaction boundaries
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SqlServerMigration021IntegrationTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=p2-migration-021.trx"
          --results-directory TestResults/P2Migration021

      - name: Retain registered migration 021 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-migration-021-evidence
          path: TestResults/P2Migration021
          if-no-files-found: warn

      - name: Verify P3 historical contribution, R/S and recursive result authority
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SqlContainmentHistoricalAuthorityIntegrationTests|FullyQualifiedName~SqlContainmentHistoricalResultIntegrationTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=p3-historical-authority.trx"
          --results-directory TestResults/P3HistoricalAuthority

      - name: Retain P3 historical authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-historical-authority-evidence
          path: TestResults/P3HistoricalAuthority
          if-no-files-found: warn

      - name: Verify P4 caller-transaction archive foundation
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SqlContainmentArchiveIntegrationTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=p4-archives.trx"
          --results-directory TestResults/P4Archives

      - name: Retain P4 archive foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-archive-foundation-evidence
          path: TestResults/P4Archives
          if-no-files-found: warn

      - name: Verify P4 atomic containment publication
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SqlContainmentPublicationIntegrationTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=p4-publication.trx"
          --results-directory TestResults/P4Publication

      - name: Retain P4 atomic publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-atomic-publication-evidence
          path: TestResults/P4Publication
          if-no-files-found: warn

      - name: Verify P5 exact-processor reporting reads
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SqlContainmentVerifiedReadIntegrationTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=p5-verified-reads.trx"
          --results-directory TestResults/P5VerifiedReads

      - name: Retain P5 verified reporting read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-verified-read-evidence
          path: TestResults/P5VerifiedReads
          if-no-files-found: warn

      - name: Verify containment processor composition
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~SqlContainmentProcessorCompositionIntegrationTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=containment-composition.trx"
          --results-directory TestResults/ContainmentComposition

      - name: Retain containment composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-composition-evidence
          path: TestResults/ContainmentComposition
          if-no-files-found: warn

      - name: Check B1 prototype fixture and exact-cut path first
        env:
          B1_VALIDATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~B1ConcurrencyAcceptanceTests.C1AdvancementAfterPublicationPrefixCannotLeakIntoBoundCut"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=b1-concurrency-smoke.trx"
          --results-directory TestResults/B1Concurrency

      - name: Validate B1 C1-C8 transaction prototype
        env:
          B1_VALIDATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~B1ConcurrencyAcceptanceTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=b1-concurrency.trx"
          --results-directory TestResults/B1Concurrency

      - name: Retain B1 concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-concurrency-evidence
          path: TestResults/B1Concurrency
          if-no-files-found: warn

      - name: Validate isolated B1 RC2 proposed schema
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~B1Rc2DesignValidationTests"
          --logger "console;verbosity=normal"

      - name: Characterize B1 source writer locks (not C1-C8 acceptance)
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~B1SourceWriterLockCharacterizationTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=b1-source-locks.trx"
          --results-directory TestResults/B1SourceLocks

      - name: Retain B1 source lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-source-lock-evidence
          path: TestResults/B1SourceLocks
          if-no-files-found: warn

      - name: Accept GG-003 revision-534 SQL historical reader
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~Gg003SqlHistoricalReaderAcceptanceTests"
          --logger "console;verbosity=normal"

      - name: Test SQL Server integration suite
        run: >-
          dotnet test tests/FactoryConnect.Integration.Tests/FactoryConnect.Integration.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=SqlServerIntegration"

