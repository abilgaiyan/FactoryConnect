name: P0 SQL readiness conformance
on:
  push:
    branches: [feature/fc-p0-reboot-sql-readiness]
  pull_request:
    branches: [main]
    paths:
      - 'tools/FactoryConnect.SqlReadiness/**'
      - 'Directory.Packages.props'
      - 'scripts/deployment/FactoryConnect.SqlReadiness.ps1'
      - 'scripts/deployment/Restart-FactoryConnectDashboard.ps1'
      - 'scripts/deployment/FactoryConnect.ProcessTermination.ps1'
      - 'tests/deployment/*DashboardRestart*'
      - 'scripts/deployment/Start-FactoryConnectSystem.ps1'
      - 'scripts/deployment/Start-FactoryConnectRuntime.ps1'
      - 'tests/deployment/*BootSafe*'
      - 'scripts/release/Build-FactoryConnectRelease.ps1'
      - 'tests/deployment/*SqlReadiness*'
      - 'tests/deployment/Invoke-FactoryBootOrchestrationConformance.ps1'
      - 'tests/deployment/Invoke-RebootStartupReleasePackageConformance.ps1'
      - '.github/workflows/p0-sql-readiness.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-conformance:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Publish runtime-aligned readiness provider
        shell: powershell
        run: |
          dotnet publish tools/FactoryConnect.SqlReadiness/FactoryConnect.SqlReadiness.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/sql-readiness"
          if ($LASTEXITCODE -ne 0) { throw 'SQL readiness publish failed.' }
      - name: SQL readiness executable conformance
        shell: powershell
        run: .\tests\deployment\Invoke-SqlReadinessConformance.ps1 -ProviderExecutable "$env:RUNNER_TEMP/sql-readiness/FactoryConnect.SqlReadiness.exe"
      - name: Existing boot and runtime contracts
        shell: powershell
        run: |
          .\tests\deployment\Invoke-FactoryBootOrchestrationConformance.ps1
          .\tests\deployment\Invoke-RebootStartupConformance.ps1
          .\tests\deployment\Invoke-BootSafeRuntimeConformance.ps1
          .\tests\deployment\Invoke-RebootStartupIntentConformance.ps1
          .\tests\deployment\Invoke-RebootStartupExecutableConformance.ps1
          .\tests\deployment\Invoke-RebootStartupDeploymentExclusionConformance.ps1
          .\tests\deployment\Invoke-RebootStartupReleasePackageConformance.ps1
      - name: Dashboard-only restart lifecycle and real Windows processes
        shell: powershell
        run: |
          .\tests\deployment\Invoke-DashboardRestartConformance.ps1 -Executable
      - name: Authenticated SQL readiness proof
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & SqlLocalDB.exe create FactoryConnectCI -s
          if (-not $?) { throw 'CI named SQL LocalDB instance could not be created/started.' }
          & SqlLocalDB.exe info FactoryConnectCI
          if (-not $?) { throw 'CI named SQL LocalDB instance could not be inspected.' }
          $env:FACTORYCONNECT_SQL_READINESS_TEST_CONNECTION_STRING = 'Server=(localdb)\FactoryConnectCI;Database=master;Integrated Security=True;Encrypt=False'
          .\tests\deployment\Invoke-SqlReadinessConformance.ps1 -LiveSql -ProviderExecutable "$env:RUNNER_TEMP/sql-readiness/FactoryConnect.SqlReadiness.exe"
      - name: Build exact-source release and verify packaged helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = .\scripts\release\Build-FactoryConnectRelease.ps1 -SourceCommit (git rev-parse HEAD) -OutputRoot (Join-Path $env:RUNNER_TEMP 'p0-release')
          .\tests\deployment\Invoke-RebootStartupReleasePackageConformance.ps1 -ReleaseDirectory $release.ReleaseDirectory
          $env:FACTORYCONNECT_SQL_READINESS_TEST_CONNECTION_STRING = 'Server=(localdb)\FactoryConnectCI;Database=master;Integrated Security=True;Encrypt=False'
          .\tests\deployment\Invoke-SqlReadinessConformance.ps1 -LiveSql -ProviderExecutable (Join-Path $release.ReleaseDirectory 'apps/sql-readiness/FactoryConnect.SqlReadiness.exe')
          $release | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'p0-release/provenance.json')
      - uses: actions/upload-artifact@v4
        with:
          name: p0-sql-readiness-release
          path: ${{ runner.temp }}/p0-release
      - name: Stop disposable CI SQL instance
        if: always()
        shell: powershell
        run: |
          & SqlLocalDB.exe stop FactoryConnectCI -k
          & SqlLocalDB.exe delete FactoryConnectCI
          # Cleanup is best effort; proof failures remain authoritative.
          exit 0
